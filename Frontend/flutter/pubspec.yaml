name: face_payment
description: "Flutter frontend for Face Payment."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  camera: ^0.12.1
  google_mlkit_barcode_scanning: ^0.16.1
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_image_labeling: ^0.16.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  image_picker: ^1.2.3
  flutter_tts: ^4.2.5
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
